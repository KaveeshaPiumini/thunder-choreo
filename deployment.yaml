server:
  hostname: "0.0.0.0"
  port: 8090
  http_only: true
  public_url: "https://31b257d9-f77d-4503-b823-3d45d06af736-dev.e1-us-east-azure.choreoapis.dev/thunder-idp/thunder-id/v1.0"



database:
  config:
    type: "sqlite"
    sqlite:
      path: "tmp/thunder-db/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime:
    type: "sqlite"
    sqlite:
      path: "tmp/thunder-db/runtimedb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  user:
    type: "sqlite"
    sqlite:
      path: "tmp/thunder-db/userdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://tmp/thunder-security/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "tmp/thunder-security/signing.cert"
      key_file: "tmp/thunder-security/signing.key"

jwt:
  preferred_key_id: "default-key"

cors:
  allowed_origins:
    - regex: '.*'

consent:
  enabled: false
